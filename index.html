<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fleetwood IT Support - Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #172033;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            margin: auto;
            border-radius: 16px;
            background: #1268d8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .logo h1 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .logo p {
            color: #718096;
            font-size: 14px;
        }

        .login-type {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 22px;
        }

        .login-type button {
            border: 1px solid #d9e1ec;
            background: #f8fafc;
            padding: 12px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .login-type button.active {
            background: #1268d8;
            color: white;
            border-color: #1268d8;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8e0ea;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #1268d8;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #1268d8;
            color: white;
            padding: 14px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0d57b6;
        }

        .login-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            background: #fff1f1;
            color: #c53030;
            border: 1px solid #fed7d7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .staff-link {
            text-align: center;
            margin-top: 22px;
        }

        .staff-link a {
            color: #1268d8;
            text-decoration: none;
            font-size: 14px;
        }

        .security-note {
            text-align: center;
            margin-top: 20px;
            color: #8793a5;
            font-size: 12px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">

            <div class="logo-icon">
                🛠️
            </div>

            <h1>Fleetwood IT Support</h1>

            <p>Secure Staff Access</p>

        </div>


        <div class="login-type">

            <button
                type="button"
                id="itLoginType"
                class="active">

                IT Support

            </button>

            <button
                type="button"
                id="managerLoginType">

                Manager

            </button>

        </div>


        <div
            id="errorMessage"
            class="error-message">
        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton">

                Login to IT Support

            </button>

        </form>


        <div class="staff-link">

            <a href="staff.html">
                ← Staff Request Portal
            </a>

        </div>


        <div class="security-note">
            Fleetwood Lending Limited • IT Support System
        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="login.js"></script>

</body>
</html>
